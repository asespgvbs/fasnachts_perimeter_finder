<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Fasnachtsperimeter Basel</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/bootstrap.js"></script>
</head>
<body>
  <header>
    <h1>Fasnachtsperimeter <span>Basel</span></h1>
    <div class="actions">
      <button id="file-button" type="button" disabled>Perimeter laden</button>
      <button id="excel-button" type="button" disabled>Gebäude importieren</button>
      <button id="export-button" type="button" disabled>Perimeter-Gebäude exportieren</button>
      <input id="file-input" type="file" accept=".csv,.geojson,.gjson,.json,text/csv,application/geo+json,application/json" hidden>
      <input id="excel-input" type="file" accept=".xlsx,.xls" hidden>
    </div>
  </header>
  <section class="summary-bar" aria-label="Gebäudeauswertung">
    <p id="analysis-status" role="status" aria-live="polite">Gebäude-Excel über «Gebäude importieren» auswählen.</p>
    <span class="counts" aria-live="polite"><span class="inside">▲ Innerhalb: <strong id="inside-count">–</strong></span><span class="outside">▲ Ausserhalb: <strong id="outside-count">–</strong></span><span>Ungeklärt: <strong id="unresolved-count">–</strong></span></span>
    <details id="unresolved-panel" hidden><summary>Nicht zugeordnete Adressen anzeigen</summary><div id="unresolved-list"></div></details>
  </section>
  <main id="map" aria-label="Karte Basel mit GeoBS-Grundkarte"></main>
  <footer>
    <span id="status" role="status" aria-live="polite">Leaflet wird lokal geladen …</span>
    <span id="tile-status" role="status" aria-live="polite"></span>
    <span id="library-status" role="status" aria-live="polite"></span>
  </footer>
  <noscript>Für die Karte muss JavaScript aktiviert sein.</noscript>
</body>
</html>
